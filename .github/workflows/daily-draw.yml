# Daily draw (docs/DRAW.md): draws, commits data/results.json to main, then deploys.
# Outside December 1–24 the script does nothing. Logs are public: the script only prints ids and display names.
name: daily-draw

on:
  schedule:
    # 06:45 UTC = 07:45 Paris in December (UTC+1), the time of the drand round.
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-draw
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Draw
        run: npm run draw
        env:
          PARTICIPANTS_CSV_B64: ${{ secrets.PARTICIPANTS_CSV_B64 }}
      - name: Commit results
        id: commit
        run: |
          if git diff --quiet -- data/results.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/results.json
          git commit -m "Draw results for $(TZ=Europe/Paris date +%F)"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: draw
    # A manual run also redeploys, in case a previous deployment failed after the draw was committed.
    if: needs.draw.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
