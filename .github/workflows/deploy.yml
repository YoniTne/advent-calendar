# Builds the static site from main and publishes it on GitHub Pages.
# Runs on every push to main, and is called by daily-draw after a draw
# (commits pushed with GITHUB_TOKEN do not trigger push workflows).
# Prize texts come from the PRIZES_JSON_B64 secret; a build only holds the prizes already shown
# (vite.config.ts), so an evening run puts the next day's prize online.
name: deploy

on:
  push:
    branches: [main]
  schedule:
    # 16:15 UTC = 17:15 Paris in winter: ahead of the 18:00 reveal, GitHub's cron often runs late.
    - cron: '15 16 30 11 *'
    - cron: '15 16 1-23 12 *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}" npm run build
        env:
          PRIZES_JSON_B64: ${{ secrets.PRIZES_JSON_B64 }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
